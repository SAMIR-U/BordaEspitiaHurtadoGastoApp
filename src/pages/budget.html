<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuesto</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header><h1>Establecer Presupuesto</h1></header>
  <div class="container">
    <div class="card">
      <form id="budget-form">
        <div class="form-group">
          <label for="general-budget">Presupuesto General Mensual ($)</label>
          <input type="number" id="general-budget" step="0.01" required>
        </div>
        <h3>Categorías (Opcional)</h3>
        <div class="form-group">
          <label for="cat-comida">Comida ($)</label>
          <input type="number" id="cat-comida" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label for="cat-transporte">Transporte ($)</label>
          <input type="number" id="cat-transporte" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label for="cat-ocio">Ocio ($)</label>
          <input type="number" id="cat-ocio" step="0.01" value="0">
        </div>
        <button type="submit" class="btn">Guardar Presupuesto</button>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="expenses.html">💸 Gastos</a>
    <a href="budget.html" class="active">🎯 Presupuesto</a>
    <a href="profile.html">👤 Perfil</a>
  </nav>
  <script src="../js/app.js"></script>
</body>
</html>
