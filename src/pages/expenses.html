<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Gastos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <header>
    <h1>Registrar Gasto</h1>
  </header>
  <div class="container">
    <div id="alert-box" class="alert"></div>

    <div class="card">
      <form id="expense-form">
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="">Seleccione...</option>
            <option value="Comida">Comida</option>
            <option value="Transporte">Transporte</option>
            <option value="Ocio">Ocio</option>
            <option value="Servicios">Servicios</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Descripción</label>
          <!-- VALIDACIÓN: maxlength para evitar textos muy largos -->
          <input type="text" id="description" placeholder="Ej: Almuerzo" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="amount">Monto ($)</label>
          <!-- VALIDACIÓN: min="0.01" para evitar montos negativos o cero -->
          <input type="number" id="amount" step="0.01" min="0.01" required>
        </div>
        <button type="submit" class="btn">Guardar Gasto</button>
      </form>
    </div>

    <div class="card">
      <h2>Últimos Gastos</h2>
      <ul id="expense-list" class="list-group"></ul>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="expenses.html" class="active">💸 Gastos</a>
    <a href="budget.html">🎯 Presupuesto</a>
    <a href="profile.html">👤 Perfil</a>
  </nav>
  <script src="../js/expenses.js"></script>
</body>

</html>
